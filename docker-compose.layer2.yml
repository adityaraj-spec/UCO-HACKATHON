version: "3.9"

# PhaseGuard Layer 2 — docker-compose extension
# Adds Redis, Kafka, and optional HSM mock sidecar to the existing stack.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.layer2.yml up

services:

  # ------------------------------------------------------------------ #
  # Redis - JTI nonce cache + session cache + rolling embedding cache   #
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    container_name: phaseguard_redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-phaseguard_redis_secret}"
    ports:
      - "6379:6379"
    volumes:
      - phaseguard_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------------ #
  # Zookeeper + Kafka - SIEM event streaming                           #
  # ------------------------------------------------------------------ #
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: phaseguard_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - phaseguard_zk_data:/var/lib/zookeeper/data
      - phaseguard_zk_log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: phaseguard_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - phaseguard_kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------------ #
  # PhaseGuard API - Layer 2 upgraded service                          #
  # ------------------------------------------------------------------ #
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phaseguard_api_layer2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-phaseguard_redis_secret}@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - phaseguard_faiss_data:/app/faiss_indices
      - phaseguard_temp_audio:/app/temp_audio
    restart: unless-stopped

volumes:
  phaseguard_redis_data:
  phaseguard_zk_data:
  phaseguard_zk_log:
  phaseguard_kafka_data:
  phaseguard_faiss_data:
  phaseguard_temp_audio:
